[build]
  publish = "."
  command = "npm ci --prefix nadie-ai --omit=dev"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/api/courses"
  to = "/.netlify/functions/api/courses"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/api/chat"
  status = 200
