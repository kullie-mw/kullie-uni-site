[build]
  publish = "."
  command = "npm ci --prefix nadie-ai --omit=dev"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # GROQ_BASE_URL and HOST are non-secret configuration values (a public API
  # endpoint and a bind address) that legitimately appear in source/docs.
  # GROQ_API_KEY remains protected by secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "GROQ_BASE_URL,HOST"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/api/courses"
  to = "/.netlify/functions/api/courses"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/api/chat"
  status = 200
